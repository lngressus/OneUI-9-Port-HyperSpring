name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOOLS: ${{ github.workspace }}/.tools
      JADX_VERSION: "1.5.1"
      APKTOOL_VERSION: "2.10.0"
      SIGNER_VERSION: "1.3.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ env.JADX_VERSION }}-${{ env.APKTOOL_VERSION }}-${{ env.SIGNER_VERSION }}-api35

      - name: Download tools
        run: |
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          [ -f android.jar ] || curl -fsSL -o android.jar \
            https://raw.githubusercontent.com/Sable/android-platforms/master/android-35/android.jar
          if [ ! -d jadx ]; then
            curl -fsSL -o jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
            unzip -q jadx.zip -d jadx && rm jadx.zip
          fi
          [ -f apktool.jar ] || curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          [ -f uber-apk-signer.jar ] || curl -fsSL -o uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v${SIGNER_VERSION}/uber-apk-signer-${SIGNER_VERSION}.jar"
          ls -la "$TOOLS"

      - name: Check AGSL shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libegl1 libgl1 > /dev/null
          pip install --quiet skia-python
          cp local-build/agsl_check.py "$TOOLS/agsl_check.py"

      # Временный патч: делает Log и Tune доступными из подпакета compat
      # и добавляет недостающую перегрузку f(Context, String, float).
      - name: Patch source access modifiers
        run: |
          python3 << 'PYEOF'
          import re

          # --- Log.java: public class Log ---
          log_path = 'app/src/main/java/com/icehome/up/Log.java'
          with open(log_path, 'r') as f:
              content = f.read()
          content = re.sub(r'^(\s*)class\s+Log\b', r'\1public class Log', content, flags=re.MULTILINE)
          with open(log_path, 'w') as f:
              f.write(content)
          print(f'Patched {log_path}')

          # --- Tune.java: public class Tune, public on(), public f(), + f(ctx,k,def) ---
          tune_path = 'app/src/main/java/com/icehome/up/Tune.java'
          with open(tune_path, 'r') as f:
              content = f.read()

          content = re.sub(r'^(\s*)class\s+Tune\b', r'\1public class Tune', content, flags=re.MULTILINE)
          content = re.sub(r'(\s)(?:public\s+)?static\s+boolean\s+on\s*\(', r'\1public static boolean on(', content)
          content = re.sub(r'(\s)(?:public\s+)?static\s+float\s+f\s*\(', r'\1public static float f(', content)

          # Добавить перегрузку f(Context,String,float), если её нет
          if ', float ' not in content and ',float ' not in content:
              lines = content.split('\n')
              insert_at = len(lines)
              for i in range(len(lines) - 1, -1, -1):
                  if lines[i].strip() == '}' and not lines[i].startswith(' '):
                      insert_at = i
                      break
              overload = [
                  '',
                  '    public static float f(Context c, String k, float defaultValue) {',
                  '        return f(c, k);',
                  '    }',
              ]
              lines[insert_at:insert_at] = overload
              content = '\n'.join(lines)
              print('Added f(Context, String, float) overload')

          with open(tune_path, 'w') as f:
              f.write(content)
          print(f'Patched {tune_path}')
          PYEOF

      - name: Build
        run: bash local-build/build.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperSpring-${{ github.sha }}
          path: |
            local-build/out/HyperSpring.apk
            local-build/out/HyperSpring-legacy.apk
          if-no-files-found: warn
