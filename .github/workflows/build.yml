name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOOLS: ${{ github.workspace }}/.tools
      JADX_VERSION: "1.5.1"
      APKTOOL_VERSION: "2.10.0"
      SIGNER_VERSION: "1.3.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ env.JADX_VERSION }}-${{ env.APKTOOL_VERSION }}-${{ env.SIGNER_VERSION }}-api35

      - name: Download tools
        run: |
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          [ -f android.jar ] || curl -fsSL -o android.jar \
            https://raw.githubusercontent.com/Sable/android-platforms/master/android-35/android.jar
          if [ ! -d jadx ]; then
            curl -fsSL -o jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
            unzip -q jadx.zip -d jadx && rm jadx.zip
          fi
          [ -f apktool.jar ] || curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          [ -f uber-apk-signer.jar ] || curl -fsSL -o uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v${SIGNER_VERSION}/uber-apk-signer-${SIGNER_VERSION}.jar"
          ls -la "$TOOLS"

      - name: Check AGSL shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libegl1 libgl1 > /dev/null
          pip install --quiet skia-python
          cp local-build/agsl_check.py "$TOOLS/agsl_check.py"

      # Устойчивый патч исходников перед сборкой.
      # Делает Log и Tune public, все static-методы Log — public,
      # on()/f() в Tune — public, и добавляет f(Context, String, float).
      - name: Patch source access modifiers
        run: |
          python3 << 'PYEOF'
          import re, sys

          def looks_like_method_decl(line):
              s = line.lstrip()
              if s.startswith('//') or s.startswith('*'):
                  return False
              if 'static' not in line or '(' not in line:
                  return False
              return True

          def make_public_static_line(line):
              # Удаляем private/protected
              line = re.sub(r'\b(?:private|protected)\b\s*', '', line)
              # Если public уже стоит до static — ничего не делаем
              sp = line.find('static')
              pp = line.find('public')
              if pp != -1 and pp < sp:
                  return line
              # Иначе вставляем public перед первым static
              return line.replace('static', 'public static', 1)

          def make_public_class(content, class_name):
              content = re.sub(
                  r'\b(?:public|private|protected)\s+'
                  r'(?=(?:(?:final|abstract|static)\s+)*class\s+' + class_name + r'\b)',
                  '', content, count=1
              )
              content = re.sub(
                  r'\b(?=(?:(?:final|abstract|static)\s+)*class\s+' + class_name + r'\b)',
                  'public ', content, count=1
              )
              return content

          # --- Log.java ---
          log_path = 'app/src/main/java/com/icehome/up/Log.java'
          with open(log_path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = make_public_class(content, 'Log')
          out = []
          for line in content.split('\n'):
              if looks_like_method_decl(line):
                  line = make_public_static_line(line)
              out.append(line)
          with open(log_path, 'w', encoding='utf-8') as f:
              f.write('\n'.join(out))
          print('Patched', log_path)

          # --- Tune.java ---
          tune_path = 'app/src/main/java/com/icehome/up/Tune.java'
          with open(tune_path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = make_public_class(content, 'Tune')

          # Добавить перегрузку f(Context, String, float), если её нет
          has_3arg = re.search(
              r'static\s+(?:final\s+)?float\s+f\s*\(\s*Context\s+\w+\s*,\s*String\s+\w+\s*,\s*float\s+',
              content
          )
          if not has_3arg:
              lines = content.split('\n')
              insert_at = len(lines)
              for i in range(len(lines) - 1, -1, -1):
                  if lines[i].strip() == '}' and not lines[i].startswith(' '):
                      insert_at = i
                      break
              lines[insert_at:insert_at] = [
                  '',
                  '    public static float f(Context c, String k, float defaultValue) {',
                  '        return f(c, k);',
                  '    }',
              ]
              content = '\n'.join(lines)
              print('Added f(Context, String, float) overload in Tune')

          # Делаем public static-методы on(...) и f(...)
          out = []
          for line in content.split('\n'):
              if looks_like_method_decl(line):
                  if re.search(r'\bstatic\b[^(]*\bon\s*\(', line) or \
                     re.search(r'\bstatic\b[^(]*\bf\s*\(', line):
                      line = make_public_static_line(line)
              out.append(line)
          content = '\n'.join(out)

          with open(tune_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Patched', tune_path)

          # Санити-проверка: не осталось ли голых "private static on(" или "static on(" без public
          bad = []
          for path in [log_path, tune_path]:
              with open(path, 'r', encoding='utf-8') as f:
                  for i, l in enumerate(f, 1):
                      if re.search(r'(?:^|\s)(?:private|protected)\s+static\b', l):
                          bad.append(f'{path}:{i}: {l.strip()}')
          if bad:
              print('WARNING: leftover private/protected static:')
              for b in bad:
                  print(' ', b)
          else:
              print('Sanity check OK: no leftover private/protected static in Log.java, Tune.java')
          PYEOF

          echo "=== Diff after patch ==="
          git --no-pager diff --stat
          git --no-pager diff

      - name: Build
        run: bash local-build/build.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperSpring-${{ github.sha }}
          path: |
            local-build/out/HyperSpring.apk
            local-build/out/HyperSpring-legacy.apk
          if-no-files-found: warn
